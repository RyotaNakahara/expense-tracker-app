<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Expense tracker">
  <defs>
    <!-- Dashboard .monthly-summary-section ???: 135deg #667eea ? #764ba2 -->
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="55%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#764ba2" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#bg)" />
  <rect width="32" height="32" rx="9" fill="url(#shine)" />
  <g opacity="0.28" fill="#4c1d95">
    <rect x="6" y="21" width="5" height="7" rx="2.5" />
    <rect x="13.75" y="15.5" width="5" height="12.5" rx="2.5" />
    <rect x="21.5" y="10" width="5" height="18" rx="2.5" />
  </g>
  <g fill="url(#bar)">
    <rect x="5.5" y="19.5" width="5" height="7.5" rx="2.5" />
    <rect x="13.25" y="14" width="5" height="13" rx="2.5" />
    <rect x="21" y="8.5" width="5" height="18.5" rx="2.5" />
  </g>
</svg>
